joy_node:
  ros__parameters:
    deadzone: 0.10
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: false
    enable_button: 5
    enable_turbo_button: 4
    axis_linear:
      x: 1
    scale_linear:
      x: 0.30
    scale_linear_turbo:
      x: 0.55
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.75
    scale_angular_turbo:
      yaw: 1.20
